[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "attic"
version = "0.1.0"
description = "Keep a local, always-current semantic index of the files on your computer, searchable from Claude via MCP. Built on kuhaku."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # attic reaches into ChromaVectorStore's collection for upsert/delete (see
    # attic/store.py), so it is pinned to the minor version that layout was verified on.
    "kuhaku>=0.2,<0.3",
    "chromadb>=1.0",
    "sentence-transformers>=3.0",
    "pathspec>=0.12",
    "watchdog>=4.0",
    "mcp>=2.3,<3",
    "psutil>=5.9",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
attic = "attic.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
